<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>MONO FROG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap">
<style>
/* layout: one-screen arcade cabinet — header strip, integer-scaled pixel screen, thumb controls */
:root{
  --bg:#0b0b0c; --panel:#141415; --line:#2c2c2e; --ink:#f1f1ee; --mute:#8b8b87; --key:#1d1d1f; --wood:#23201c; --woodl:#4d473f;
  --px:"Silkscreen","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",monospace;
  --sans:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px;box-sizing:border-box;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto;position:relative}
#accBtn{position:relative}
#accBtn.on::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;background:var(--ink)}
#accPop{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*17);z-index:30;background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 0 #000;padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:min(260px,100%);box-sizing:border-box;font-size:12px;line-height:1.4}
#accPop b{font-weight:400;color:var(--ink);overflow-wrap:anywhere}
#accPop em{font-style:normal;color:var(--mute)}
#accPop button{align-self:flex-start;border-radius:0}
h1{font-family:var(--px);font-weight:400;font-size:15px;letter-spacing:.05em;margin:0;white-space:nowrap}
.zone{font-size:12px;color:var(--mute);letter-spacing:.04em}
.stats{display:flex;gap:9px;flex:1;min-width:0;justify-content:flex-end;font-family:var(--px);font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.stats b{color:var(--ink);font-weight:400}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;margin-top:6px}
.icon{padding:5px 6px;line-height:0;border-radius:6px}
.icon.armed{background:var(--ink);color:var(--bg)}
.screen{position:relative;line-height:0}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:2px solid var(--line);outline-offset:2px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.78);line-height:1.5;text-align:center;padding:16px;box-sizing:border-box}
.overlay h2{font-family:var(--px);font-weight:400;font-size:18px;margin:0;letter-spacing:.05em}
.overlay p{margin:0;font-size:13px;color:var(--mute);max-width:26ch}
.screen{--u:2px}
.toast{position:absolute;left:0;right:0;top:calc(var(--u)*26);text-align:center;pointer-events:none;line-height:1.4}
.toast span{display:inline-block;background:rgba(0,0,0,.7);padding:6px 12px;font-size:13px;color:var(--ink)}
.toast b{font-family:var(--px);font-weight:400;font-size:11px;color:var(--mute);margin-right:8px}
.intro{background:transparent;justify-content:flex-start;padding-top:calc(var(--u)*30);cursor:pointer}
.intro .logo{font-family:var(--px);font-size:calc(var(--u)*17);letter-spacing:.06em;line-height:1;color:var(--ink);background:rgba(0,0,0,.55);padding:calc(var(--u)*3) calc(var(--u)*5)}
.intro .tag{font-size:calc(var(--u)*6.4);color:var(--ink);background:rgba(0,0,0,.55);padding:2px 8px;max-width:none}
.intro .start{position:absolute;left:0;right:0;bottom:calc(var(--u)*22);font-family:var(--px);font-size:calc(var(--u)*6);letter-spacing:.08em;color:var(--ink)}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.intro .start{animation:none}}
.map{background:transparent;justify-content:space-between;padding:calc(var(--u)*4) 8px calc(var(--u)*4);pointer-events:none}
.map>*{pointer-events:auto}
.mtitle{font-size:max(13px,calc(var(--u)*7.5))!important;background:rgba(0,0,0,.6);padding:2px 10px}
#plaques{position:absolute;inset:0;pointer-events:none}
.plq{position:absolute;left:calc(var(--u)*113);right:calc(var(--u)*3);transform:translateY(-50%);pointer-events:auto;text-align:left;background:var(--wood);border:1px solid var(--woodl);border-radius:0;padding:calc(var(--u)*1.8) calc(var(--u)*2.6);color:var(--ink);display:block;line-height:1.25;box-shadow:0 2px 0 #000;cursor:pointer}
.plq::before{content:"";position:absolute;left:calc(var(--u)*-7);top:50%;width:calc(var(--u)*6);border-top:1px dashed var(--woodl)}
.plq .n{font-family:var(--px);font-size:max(10px,calc(var(--u)*4.4));color:var(--mute);margin-right:5px}
.plq .t{font-size:max(11px,calc(var(--u)*5.4))}
.plq .s{display:flex;align-items:center;gap:3px;font-size:max(10px,calc(var(--u)*4.4));color:var(--mute);margin-top:1px;font-variant-numeric:tabular-nums}
.plq .d{white-space:pre-line;display:none;font-size:max(10px,calc(var(--u)*4.4));color:var(--ink);margin-top:3px;padding-top:3px;border-top:1px dashed var(--woodl)}
.plq.open .d{display:block}
.plq.off .t{color:var(--mute)}
.plq.here{border-color:var(--ink)}
.acc{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink);background:rgba(0,0,0,.65);padding:4px 8px;max-width:100%}
.acc span{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-overflow:ellipsis}
.acc em{font-style:normal;color:var(--mute)}
.acc button{font-size:11px;padding:5px 9px;border-radius:0;flex:none}
.mfoot{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#mapNote{font-size:max(10px,calc(var(--u)*4.4));background:rgba(0,0,0,.6);padding:2px 8px;max-width:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.acts button{font-size:13px;padding:9px 16px;border-radius:0;border:2px solid var(--line);box-shadow:0 2px 0 #000}
.acts .main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.overlay{transition:opacity .2s steps(4)}
.overlay.leaving{opacity:0}
@keyframes dropIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes riseIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes plqIn{from{transform:translate(36px,-50%);opacity:0}to{transform:translate(0,-50%);opacity:1}}
@keyframes popIn{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.map:not([hidden]) .mtitle{animation:dropIn .4s steps(5) .1s both}
.map:not([hidden]) .plq{animation:plqIn .42s steps(6) both;animation-delay:calc(.18s + var(--i,0)*.07s)}
.map:not([hidden]) .mfoot{animation:riseIn .4s steps(5) .55s both}
#win:not([hidden]){animation:fadeIn .5s steps(6) .25s both}
#win:not([hidden]) h2{animation:popIn .55s steps(7) .45s both}
#win:not([hidden]) p,#win:not([hidden]) .acts{animation:riseIn .4s steps(5) .8s both}
.intro .logo{animation:dropIn .6s steps(6) .35s both}
.intro .tag{animation:fadeIn .6s steps(6) .8s both}
.intro .start{animation:fadeIn .4s steps(4) 1.2s both,blink 1.3s steps(2,start) 1.6s infinite}
#toast:not([hidden]) span{animation:dropIn .35s steps(4) both}
@media (prefers-reduced-motion:reduce){.map *,#win,#win *,.intro *,#toast span{animation:none!important}.overlay{transition:none}}
.bar{display:flex;justify-content:center;max-width:560px;width:100%;margin:6px auto 0}
.hint{font-size:12px;color:var(--mute)}
.small{display:flex;gap:8px}
button{font-family:var(--sans);font-size:12px;color:var(--ink);background:var(--key);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pad{display:none;gap:8px;max-width:560px;width:100%;margin:8px auto 0;touch-action:none}
.pad button{height:58px;flex:1;border-radius:0;border:2px solid #000;padding:0;color:#fff;background:#474747 var(--stone,none) repeat;background-size:96px 96px;image-rendering:pixelated;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.38),inset 2px 0 0 rgba(255,255,255,.16),inset -2px 0 0 rgba(0,0,0,.35),inset 0 -4px 0 rgba(0,0,0,.45),0 3px 0 #000;display:flex;align-items:center;justify-content:center;gap:9px}
.pad button.on{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(0,0,0,.45),inset 0 -1px 0 rgba(255,255,255,.12);filter:brightness(.75)}
.pad .pa{width:18px;height:33px;filter:drop-shadow(2px 2px 0 #000)}
.pad .pj{width:16px;height:20px;filter:drop-shadow(2px 2px 0 #000)}
.pad .jump{flex:1.6}
.pad .jl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-shadow:1px 1px 0 #000,0 1px 0 #000}
.pad .jl b{font-size:16px;font-weight:800}
.pad .jl small{font-size:10px;font-weight:600;color:#ddd}
.hud{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*3);z-index:7;pointer-events:none;background:#141414;border:1px solid #000;box-shadow:inset 0 1px 0 #3d3d3d;padding:calc(var(--u)*1.4) calc(var(--u)*3);
  font-family:var(--sans);font-weight:700;font-size:max(11px,calc(var(--u)*5));color:#fff;text-shadow:1px 1px 0 #000;line-height:1.2;white-space:nowrap;display:flex;gap:4px;font-variant-numeric:tabular-nums}
.hud i{font-style:normal;color:#7a7a7a}
.screen:not(.play) .hud{display:none}
.tools{position:absolute;right:calc(var(--u)*3);top:calc(var(--u)*3);z-index:8;display:flex;gap:calc(var(--u)*2)}
.tool{width:calc(var(--u)*13);height:calc(var(--u)*12);min-width:26px;min-height:24px;padding:0;border-radius:0;border:1px solid #000;background:#3d3d3d;color:#fff;
  box-shadow:inset 1px 1px 0 #6e6e6e,inset -1px -1px 0 #1e1e1e,0 2px 0 #000;display:grid;place-items:center;position:relative}
.tool:active{transform:translateY(1px);box-shadow:inset 1px 1px 0 #2a2a2a}
.tool .pi{width:calc(var(--u)*9);height:calc(var(--u)*7);min-width:18px;min-height:14px;filter:drop-shadow(1px 1px 0 #000)}
.tool.on::after{content:"";position:absolute;right:2px;top:2px;width:4px;height:4px;background:#fff;box-shadow:1px 1px 0 #000}
@media (pointer:coarse){.pad{display:flex}.bar{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="screen" id="screen">
    <canvas id="cv" width="180" height="240" aria-label="우물 안 개구리 게임 화면"></canvas>
    <div class="toast" id="toast" hidden></div>
    <div class="hud" id="hud" aria-live="off"><span>높이 <b id="sH">0</b>m</span><i>·</i><span>점프 <b id="sJ">0</b></span><i>·</i><span>철퍼덕 <b id="sF">0</b></span><b id="sB" hidden>0</b></div>
    <div class="tools" id="tools">
      <button id="mute" class="tool" aria-pressed="false" aria-label="소리 끄기" title="소리"><svg class="pi" viewBox="0 0 9 7" width="9" height="7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="3" y="0" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="5" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="2" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="5" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="2" y="5" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/></svg></button>
      <button id="mapBtn" class="tool" aria-label="우물 지도" title="우물 지도"><svg class="pi" viewBox="0 0 9 7" width="9" height="7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="1" height="1"/><rect x="1" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="0" y="2" width="1" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="0" y="3" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/><rect x="0" y="4" width="1" height="1"/><rect x="3" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="3" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="7" y="5" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg></button>
      <button id="accBtn" class="tool" aria-label="계정" title="계정" aria-expanded="false" hidden><svg class="pi" viewBox="0 0 9 7" width="9" height="7" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><rect x="3" y="0" width="1" height="1"/><rect x="4" y="0" width="1" height="1"/><rect x="5" y="0" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="3" y="3" width="1" height="1"/><rect x="4" y="3" width="1" height="1"/><rect x="5" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="2" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/><rect x="0" y="5" width="1" height="1"/><rect x="8" y="5" width="1" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="3" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="5" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="7" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/></svg></button>
      <button id="reset" class="tool" aria-label="처음부터" hidden></button>
    </div>
    <div id="accPop" hidden></div>
    <div class="overlay intro" id="intro">
      <div class="logo">MONO FROG</div>
      <p class="tag">우물 밖 하늘이 궁금해진 개구리</p>
      <div class="start">누르면 시작</div>
    </div>
    <div class="overlay map" id="map" hidden>
      <h2 class="mtitle">우물 지도</h2>
      <div id="plaques"></div>
      <div class="mfoot">
        <div class="acts"><button id="cont" class="main">이어하기</button><button id="newg">처음부터</button></div>
      </div>
    </div>
    <div class="overlay" id="pick" hidden>
      <h2>어느 판으로 할까요?</h2>
      <p id="pickText" style="white-space:pre-line"></p>
      <div class="acts"><button id="pickLocal" class="main">이 기기 판</button><button id="pickRemote">다른 기기 판</button></div>
    </div>
    <div class="overlay" id="win" hidden>
      <h2>우물 탈출!</h2>
      <p id="winText"></p>
      <div class="acts"><button id="toMap" class="main">우물 지도</button><button id="again">처음부터 다시</button></div>
    </div>
  </div>
</div>
<div class="bar"><span class="hint keys">스페이스 길게 눌러 힘 모으기 · ← → 방향</span></div>

{let y=0,b=0;while(y<WH+16){const hg=6+Math.floor(h(b,11)*5),st=[];let x=-Math.floor(h(b,5)*14),i=0;

  gp(g,x,y+4,1);gp(g,x+1,y+4,1);}
function propRoot(g,x0,y,dir,len){g.fillStyle=P[0];g.fillRect(dir>0?x0:x0-4,y-2,4,5);
  for(let t=0;t<len;t++){const xx=Math.round(x0+dir*t),yy=Math.round(y+Math.sin(t*0.19)*2.5+t*0.14),thin=t>len-7;
